openapi: 3.0.3
info:
  title: IKHMAD Public API Contract
  version: 0.1.0
  description: >
    Public-facing interface contract for the IKHMAD platform.
    Proprietary decision-engine internals are intentionally excluded.
servers:
  - url: https://api.example.invalid/api/v1
    description: Placeholder only - no production endpoint is published here.

paths:
  /incidents:
    post:
      summary: Submit a citizen incident report
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIncidentRequest'
      responses:
        '202':
          description: Report accepted for review
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Incident'

  /incidents/{incidentId}:
    get:
      summary: Get public incident status
      parameters:
        - in: path
          name: incidentId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Incident status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Incident'

  /sos:
    post:
      summary: Submit an SOS request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SOSRequest'
      responses:
        '202':
          description: SOS accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SOSResponse'

  /alerts:
    get:
      summary: Get alerts relevant to the authenticated user
      responses:
        '200':
          description: Alert list

  /hazards:
    get:
      summary: Get public hazard representation
      description: Does not expose proprietary hazard-computation internals.
      responses:
        '200':
          description: Public hazard output

  /routes/evaluate:
    post:
      summary: Request an evacuation route evaluation
      description: >
        Returns a route recommendation generated by private IKHMAD services.
        Internal scoring, confidence propagation and predictive calculations
        are not part of this public API specification.
      responses:
        '200':
          description: Route recommendation

  /safe-zones:
    get:
      summary: Get candidate safe zones
      responses:
        '200':
          description: Safe-zone list

components:
  schemas:
    Location:
      type: object
      required: [latitude, longitude]
      properties:
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double

    CreateIncidentRequest:
      type: object
      required: [location, observationType]
      properties:
        location:
          $ref: '#/components/schemas/Location'
        observationType:
          type: string
          example: SMOKE_OR_FIRE
        note:
          type: string

    Incident:
      type: object
      properties:
        incidentId:
          type: string
        status:
          type: string
          enum:
            - REPORTED
            - UNDER_REVIEW
            - PROBABLE
            - CONFIRMED
            - ACTIVE
            - CONTROLLED
            - CLOSED
            - REJECTED
        location:
          $ref: '#/components/schemas/Location'

    SOSRequest:
      type: object
      required: [location]
      properties:
        location:
          $ref: '#/components/schemas/Location'
        incidentId:
          type: string
          nullable: true

    SOSResponse:
      type: object
      properties:
        sosId:
          type: string
        status:
          type: string
          example: RECEIVED
